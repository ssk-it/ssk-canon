# Vérifie qu'un cadrage en cours de relecture est cohérent avant de pouvoir
# être livré. À configurer comme contrôle requis dans les règles de protection
# de la branche principale, faute de quoi il signale sans bloquer.
#
# Ce qu'il attrape, que le format seul ne garantit pas : un impact vers une
# règle inexistante, un énoncé manquant pour une création ou une modification,
# un rattachement vers une entité inconnue, une règle abrogée par un cadrage non
# livré.
name: Vérification du référentiel

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Le contrôle d'immuabilité compare la demande de fusion à la branche
          # principale : sans l'historique, la comparaison est impossible et le
          # contrôle se tait au lieu de bloquer.
          fetch-depth: 0

      # Suit la branche principale de l'outil, et non un tag de version : c'est
      # ce dépôt-ci qui éprouve l'action, et un tag mobile demanderait d'être
      # redéplacé à chaque publication — ce qui a été oublié, « v1 » étant resté
      # sur la toute première release pendant que l'outil avançait.
      - uses: ssk-it/ssk-canon-action@main
        with:
          referentiel: '.'
          # La vérification ne modifie jamais le référentiel. Elle échoue si le
          # cadrage est incohérent, ou si le référentiel a dérivé de ses cadrages.
          appliquer: 'false'
          # Rétabli : 2026-032 est livré, et la reprise de format qui exigeait
          # de toucher les cadrages livrés est derrière nous.
          immuabilite: 'true'
