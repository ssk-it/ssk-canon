# Configuration du projet — lue par l'application et par les Actions
schema_version: 1

projet:
  nom: SSK Canon
  description: >
    Le référentiel de SSK Canon, décrit dans son propre format.
    Ce dépôt sert à la fois de jeu de test au prototype et de spécification
    vivante du produit : les décisions prises pendant sa conception y sont
    consignées comme des cadrages.

tags_liens:
  - carte_trello
  - issue_github
  - maquette
  - document

statuts:
  - brouillon
  - en_relecture
  - validee
  - livree

# Transitions de statut que l'application propose, depuis chaque statut.
# « livree » n'y figure jamais : elle résulte de la fusion de la demande.
transitions:
  brouillon: [en_relecture]
  en_relecture: [brouillon, validee]
  validee: [en_relecture]

# La demande de fusion reflète le statut : ouverte en brouillon tant que le
# cadrage l'est, prête à relire dès qu'il passe en relecture.
reflet_demande_fusion: true

# Comment les rédacteurs obtiennent l'accès au dépôt.
acces: identite_tierce

# Où l'identité est vérifiée. Rien de secret : le client est public, et c'est
# l'échange à secret jetable qui le protège.
identite:
  emetteur: http://localhost:8088/realms/ssk-canon
  client: ssk-canon-pwa
  echange: http://localhost:8791

operations:
  - cree
  - modifie
  - abroge
  - touche

attachments:
  provider: scaleway
  bucket: ssk-canon-demo
  region: fr-par
